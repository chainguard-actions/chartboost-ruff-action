name: actionlint

on:
  push:
    paths:
    - '.github/workflows/**'
  pull_request:
    paths: 
    - '.github/workflows/**'

permissions: {}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1
