name: Test ruff check fails on bad code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file with lint errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/bad"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/bad/bad.py" << 'EOF'
          import os
          import sys
          x=1
          y = 2
          print(x,y)
          EOF

      - id: action
        uses: .
        with:
          args: check
          src: tests/fixtures/bad
        continue-on-error: true

      - name: Assert action failed on bad code
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on bad code, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed on bad code"
