name: Test ruff with invalid version format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          args: check
          src: .
          version: "not-a-version"
        continue-on-error: true

      - name: Assert action failed on invalid version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on invalid version format, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid version format"
